apiVersion: v2
name: organistation-platform
description: Umbrella Helm chart for the OrganiStation Microservices Platform
type: application
version: 1.0.0
appVersion: "1.0.0"

# Dependencies are managed as subcharts within the 'charts' folder
# Alternatively, they can be listed here if hosted in a private Helm Repo (ACR)
dependencies:
  - name: auth-service
    version: "0.1.0"
    repository: "file://charts/auth-service"
  - name: ai-service
    version: "0.1.0"
    repository: "file://charts/ai-service"
  - name: hr-service
    version: "0.1.0"
    repository: "file://charts/hr-service"
  - name: finance-service
    version: "0.1.0"
    repository: "file://charts/finance-service"
  - name: project-service
    version: "0.1.0"
    repository: "file://charts/project-service"
  - name: gateway-service
    version: "0.1.0"
    repository: "file://charts/gateway-service"
